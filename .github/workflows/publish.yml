name: publish

# 发布到 npm：用 trusted publishing（OIDC），仓库里不存任何 token。
# 已登记 trusted publisher（qiyaogongfang / dsh-mimaben / publish.yml），推 v* tag 即发布。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC 换 npm 短时凭据，必须

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验版本 / check version
        run: |
          node -e "
            const pkg = require('./package.json');
            const ref = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            const tagLike = /^v\d/.test(process.env.GITHUB_REF_NAME);
            if (tagLike && pkg.version !== ref) {
              console.error('版本不一致 / version mismatch：package.json ' + pkg.version + ' ≠ tag ' + ref);
              process.exit(1);
            }
            console.log('准备发布 / publishing: ' + pkg.name + '@' + pkg.version);
          "

      - name: 发布 / publish
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
