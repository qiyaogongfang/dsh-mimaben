name: publish

# 打 tag（v1.0.1 这类）时自动发布到 npm。
# 用 npm trusted publishing（OIDC），仓库里不存任何 token，也不需要 2FA 验证码。
# 前提：已在 npmjs.com 的包设置里把本仓库和 publish.yml 登记为 trusted publisher。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC 换 npm 短时凭据，必须

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 tag 与 package.json 版本一致 / check tag matches package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (pkg.version !== tag) {
              console.error('版本不一致 / version mismatch：package.json ' + pkg.version + ' ≠ tag ' + tag);
              process.exit(1);
            }
            console.log('版本一致 / version ok: ' + tag);
          "

      - name: 发布 / publish
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
